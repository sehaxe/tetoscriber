[workspace]
members = [
    "crates/teto-brain",
    "crates/teto-cli",
    "crates/teto-controller",
    "crates/teto-protocol",
    "crates/teto-worker",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
prost = "0.13.5"
prost-build = { version = "0.13.5", default-features = false }
qdrant-client = "1.18.0"
redis = { version = "1.2.2", default-features = false, features = ["connection-manager", "streams", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
teto-protocol = { path = "crates/teto-protocol" }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.12.3", default-features = false, features = ["codegen", "prost", "transport"] }
tonic-build = { version = "0.12.3", features = ["prost"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
